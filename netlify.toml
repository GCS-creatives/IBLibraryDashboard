[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Netlify Blobs works automatically inside functions when deployed on Netlify;
# no manual store credentials are needed for site-scoped stores.

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
